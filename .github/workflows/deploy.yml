# Auto-deploy to the production VPS on every push to main.
#
# Flow: checkout -> rsync source to /opt/careerpliot (server has no .git;
# .env*/storage live only there) -> docker compose rebuild -> smoke check.
#
# Required GitHub secrets (all server-specific values stay out of the repo):
#   SSH_PRIVATE_KEY  — ed25519 deploy key authorized on the VPS
#   SSH_HOST         — server address
#   SSH_USER         — SSH user on the server
#   SSH_KNOWN_HOSTS  — pinned known_hosts line for the host (TOFU protection)

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-run from the Actions tab

concurrency:
  group: deploy-main
  cancel-in-progress: false # queue overlapping pushes; never kill a running build

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Rsync source to VPS
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude .next --exclude .git \
            --exclude '.env*' --exclude storage \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/careerpliot/

      - name: Rebuild and restart container
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'cd /opt/careerpliot && docker compose up -d --build web'

      - name: Smoke check login page
        run: |
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://careerpilot.cc/login || true)
            if [ "$code" = "200" ]; then echo "login page OK (200)"; exit 0; fi
            sleep 5
          done
          echo "::error::Smoke check failed — https://careerpilot.cc/login returned $code"
          exit 1
