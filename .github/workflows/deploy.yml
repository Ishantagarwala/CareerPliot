# Auto-deploy to the production VPS on every push to main.
#
# Flow: checkout -> rsync source to /opt/careerpliot -> scripts/vps/deploy.sh
#       -> smoke check against the API host.
#
# WHY NOT `docker compose build` ANY MORE
#
# The VPS is a 2.5 GB rapidseedbox host with no swap (`swapon` is refused by the
# container stack). A default build is OOM-killed there — verified twice at
# ~1.79 GB RSS. `scripts/vps/deploy.sh` runs the same build with the webpack
# low-memory profile and restarts the container, and it is the exact path an
# operator uses by hand, so CI and a manual deploy cannot drift.
#
# Ports 80/443 belong to the provider's Apache. The app publishes on
# 127.0.0.1:3000 and the zz-api.careerpilot.cc vhost proxies to it. The apex is
# served by Vercel, so the smoke check must target the API hostname — checking
# careerpilot.cc would report Vercel's health, not the server we just rebuilt.
#
# Required GitHub secrets:
#   SSH_PRIVATE_KEY  — deploy key authorized on the VPS
#   SSH_HOST         — server address
#   SSH_USER         — SSH user on the server
#   SSH_KNOWN_HOSTS  — pinned known_hosts line (TOFU protection)
#   SSH_PORT         — optional; this host listens on 2223

name: Deploy

on:
  # Pushes do NOT deploy from here: GitHub's runners cannot reach this host
  # (`ssh: connect to host … port 2223: Connection timed out`), so every push
  # produced a red run that could never succeed. Production is updated by the
  # pull-based timer on the server itself — see scripts/vps/README.md.
  # This workflow is kept for a manual run once that reachability is fixed.
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false # queue overlapping pushes; never kill a running build

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # This host's SSH is not on 22. Override with an SSH_PORT secret if it moves.
      SSH_PORT: ${{ secrets.SSH_PORT || '2223' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Rsync source to VPS
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude .next --exclude .git \
            --exclude '.env*' --exclude storage \
            --exclude .mockups --exclude .tmp \
            -e "ssh -p $SSH_PORT -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/careerpliot/

      - name: Build and restart (low-memory profile)
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'cd /opt/careerpliot && ./scripts/vps/deploy.sh'

      - name: Smoke check the API host
        run: |
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://api.careerpilot.cc/api/auth/csrf || true)
            if [ "$code" = "200" ]; then echo "API host OK (200)"; exit 0; fi
            sleep 5
          done
          echo "::error::Smoke check failed — https://api.careerpilot.cc/api/auth/csrf returned $code"
          exit 1
