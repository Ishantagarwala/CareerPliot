services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://careerpilot.cc}
        NEXT_PUBLIC_HCAPTCHA_SITE_KEY: ${NEXT_PUBLIC_HCAPTCHA_SITE_KEY:-}
    container_name: careerpliot
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - AUTH_TRUST_HOST=true
      - AUTH_URL=https://careerpilot.cc
      - NEXTAUTH_URL=https://careerpilot.cc
      - NEXT_PUBLIC_SITE_URL=https://careerpilot.cc
      # This compose file is the public Career Pilot VPS deployment. Enable
      # the opt-in shared demo flow while keeping the application default off
      # for every other deployment.
      - DEMO_MODE=true
    volumes:
      - careerpliot_uploads:/app/public/uploads
      - careerpliot_storage:/app/storage/uploads

  caddy:
    image: caddy:2-alpine
    container_name: careerpliot-caddy
    restart: unless-stopped
    environment:
      # Interpolated into the Caddyfile's raw-IP redirect. Real value lives in
      # the server-side .env (gitignored) — never commit it.
      VPS_IP: ${VPS_IP:?VPS_IP must be set (see .env.example)}
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  careerpliot_uploads:
  careerpliot_storage:
  caddy_data:
  caddy_config:
